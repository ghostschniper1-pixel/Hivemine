# Minecraft Hivemind: FROZEN server.properties for Java Edition 1.21.1 (DESIGN.md 11.2, D13).
#
# Every statistic (spawns, ore exposure, furnace timing, despawns) is measured under exactly
# this file. Changing any value means measuring again (DESIGN.md 11.2).
#
# This is the TEMPLATE. Do not run a server from this copy and do not edit instance copies.
# `python bridge/server/servertool.py render --instance K --dir <instance dir>` writes the
# instance copy, changing only these keys:
#   server-port = 25565 + K, query.port = 25565 + K, rcon.port = 25575 + K,
#   rcon.password = $HIVEMIND_RCON_PASSWORD, level-seed = --seed (if given),
#   pvp = false only for the PvP-off control (DESIGN.md 10.2).
# `servertool.py check-properties` compares a running instance's file with this one.
#
# The vanilla server rewrites server.properties on start-up: it strips these comments, may
# reorder keys and adds any key it knows that is missing here [mem]. That is expected; the
# check compares values, not text.
#
# Labels: [n] = DESIGN.md reference, [mem] = from memory, not verified, [est] = estimate.
# The KEY NAMES below are from memory for 1.21.1 [mem] (minecraft.wiki [24] was not reachable).
# check-properties lists any key the 1.21.1 server adds on first start, which shows whether
# this list was complete. Values without a DESIGN.md reference are vanilla defaults [mem]
# unless a reason is given.

# ---- Frozen by DESIGN.md 11.2 -------------------------------------------------------------
# At 9 or below mob spawning is severely reduced [16].
view-distance=10
# Java multiplayer default; the simulator models the same ticking square [72].
simulation-distance=10
# Starvation stops at 1 HP on Normal (DESIGN.md 4.3).
difficulty=normal
# Bots have no accounts; the server must be firewalled (DESIGN.md 11.6, bridge/server/README.md).
online-mode=false
spawn-protection=0
# Needed with online-mode=false so unsigned chat from bots is accepted [mem].
enforce-secure-profile=false
# RCON: on, port 25575, localhost only [24]. Vanilla has no separate RCON bind address: the
# RCON listener binds to server-ip [mem], so server-ip=127.0.0.1 below keeps it local.
enable-rcon=true
rcon.port=25575
# NEVER commit a password here. Left empty on purpose: the render step fills it from the
# environment variable HIVEMIND_RCON_PASSWORD. With an empty password vanilla does not start
# RCON at all [mem].
rcon.password=

# ---- Network exposure (DESIGN.md 11.6) -----------------------------------------------------
# Bind the game port (and therefore RCON) to loopback only. The owner's own client on the same
# PC connects to 127.0.0.1. To let another PC on the LAN join, set server-ip= (all
# interfaces) in a deliberate, logged change and rely on the firewall rules in README.md for
# BOTH 25565-25568 and 25575-25578, because RCON then listens on every interface too [mem].
# Node hosts must connect to 127.0.0.1, not "localhost" (which may resolve to ::1 first).
server-ip=127.0.0.1
server-port=25565
# UDP query protocol off; status ping on (only reachable from this PC anyway).
enable-query=false
query.port=25565
enable-status=true
# Nobody is whitelisted: in offline mode a whitelist is keyed by the name anyone can claim.
# The firewall and loopback binding are the protection. Never /op a player name either: in
# offline mode anyone who connects under that name would be an operator; use RCON instead.
white-list=false
enforce-whitelist=false
prevent-proxy-connections=false
accepts-transfers=false
# 0 = off. Bots on loopback can burst packets after a lag spike; a limit would kick them.
rate-limit=0
network-compression-threshold=256
use-native-transport=true
log-ips=true

# ---- Gameplay (vanilla survival) -----------------------------------------------------------
gamemode=survival
force-gamemode=false
hardcore=false
# PvP on between teams, friendly fire off via scoreboard teams (D5, DESIGN.md 10.1; see
# teams-1.21.1.mcfunction). The PvP-off control (DESIGN.md 10.2) renders pvp=false.
pvp=true
# Flight is impossible for the bots; the vanilla "flying" kick stays on. If the lag shim causes
# spurious "Flying is not enabled" kicks (logged as kick events), this is the key to revisit.
# It does not change game mechanics, so changing it would not invalidate measurements.
allow-flight=false
# The Nether is out of scope in v1 (DESIGN.md 4.2); the agents cannot light portals.
allow-nether=true
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
# Bots wait between actions; never kick them for idling.
player-idle-timeout=0
# 40 agents (20 v 20) + the human + spare [est].
max-players=50
# 100 = vanilla entity tracking range. This decides which entities a bot's client is told
# about, i.e. what Mineflayer can see. Keep it at the vanilla value.
entity-broadcast-range-percentage=100

# ---- World ---------------------------------------------------------------------------------
level-name=world
# Empty in the template; each world gets its seed from the world pool (M3) via render --seed.
level-seed=
level-type=minecraft\:normal
generator-settings={}
generate-structures=true
max-world-size=29999984
# Region files must stay zlib (deflate): the NumPy region reader (DESIGN.md 4.4) reads only that.
region-file-compression=deflate
sync-chunk-writes=true
initial-enabled-packs=vanilla
initial-disabled-packs=

# ---- Operations ----------------------------------------------------------------------------
# No command blocks: setup, resets and /tick go through RCON (DESIGN.md 11.3).
enable-command-block=false
op-permission-level=4
function-permission-level=2
broadcast-console-to-ops=true
# The conductor sends many RCON commands (/tick query, /clone, /give); do not echo them to ops.
broadcast-rcon-to-ops=false
# Watchdog: a single tick longer than 60 s stops the server. Large /clone resets run in one
# tick; if they ever trip this, raise it rather than shrinking the reset (measure in M7).
max-tick-time=60000
max-chained-neighbor-updates=1000000
enable-jmx-monitoring=false
hide-online-players=false
motd=Minecraft Hivemind (private, offline mode)
text-filtering-config=
bug-report-link=
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
