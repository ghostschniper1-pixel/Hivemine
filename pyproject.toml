[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
version = "0.0.1"
description = "Minecraft Hivemind: two teams of learning Minecraft agents (see DESIGN.md)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# tools/agent.py, the Claude Agent SDK runner (see tools/README.md). Pinned: the runner was written
# against this version's source. Its wheels for Windows x64, macOS and Linux bundle Claude Code.
agent = ["claude-agent-sdk==0.2.168"]

[tool.setuptools.packages.find]
include = ["hivemind*"]

[tool.pytest.ini_options]
testpaths = ["tests", "bridge/server"]
addopts = "-q"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "network: tests that download data sources",
]
